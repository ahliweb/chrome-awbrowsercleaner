<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AW Browser Cleaner</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <div class="container">
    <header>
      <div class="logo">
        <img src="icons/icon48.png" alt="AW Browser Cleaner logo" id="header-logo">
      </div>
      <h1>AW Browser Cleaner</h1>
    </header>

    <main>
      <div class="input-group">
        <label for="originInput" data-i18n="targetOriginLabel">Target Origin</label>
        <div class="input-wrapper">
          <input type="text" id="originInput" placeholder="https://example.com" data-i18n-placeholder="targetOriginPlaceholder" spellcheck="false">
          <button id="fillCurrent" title="Use Current Tab" aria-label="Use Current Tab" data-i18n-title="useCurrentTabTitle" data-i18n-aria="useCurrentTabTitle">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
              <polyline points="15 3 21 3 21 9"></polyline>
              <line x1="10" y1="14" x2="21" y2="3"></line>
            </svg>
          </button>
        </div>
      </div>

      <div class="options-group">
        <div class="options-header">
          <label data-i18n="dataToClearLabel">Data to Clear</label>
          <button id="selectAll" class="text-btn" data-i18n="selectAll">Select All</button>
        </div>

        <div class="checkbox-grid">
          <label class="checkbox-item">
            <input type="checkbox" value="cache" checked>
            <span class="custom-check"></span>
            <span data-i18n="dataTypeCache">Cache Storage</span>
          </label>
          <label class="checkbox-item">
            <input type="checkbox" value="cookies" checked>
            <span class="custom-check"></span>
            <span data-i18n="dataTypeCookies">Cookies</span>
          </label>
          <label class="checkbox-item">
            <input type="checkbox" value="localStorage" checked>
            <span class="custom-check"></span>
            <span data-i18n="dataTypeLocalStorage">Local Storage</span>
          </label>
          <label class="checkbox-item">
            <input type="checkbox" value="indexedDB" checked>
            <span class="custom-check"></span>
            <span data-i18n="dataTypeIndexedDB">IndexedDB</span>
          </label>
          <label class="checkbox-item">
            <input type="checkbox" value="serviceWorkers" checked>
            <span class="custom-check"></span>
            <span data-i18n="dataTypeServiceWorkers">Service Workers</span>
          </label>
        </div>
      </div>

      <div id="cookieWarning" class="cookie-warning hidden" role="alert">
        <div class="cookie-warning-icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
            <line x1="12" y1="9" x2="12" y2="13"></line>
            <line x1="12" y1="17" x2="12.01" y2="17"></line>
          </svg>
        </div>
        <div class="cookie-warning-text">
          <strong data-i18n="cookieWarningTitle">Cookie Warning:</strong> <span data-i18n="cookieWarningBody">Clearing cookies may sign you out of related subdomains. Cookies can be shared across a registrable domain (e.g., clearing <code>www.example.com</code> may also affect <code>.example.com</code> cookies).</span>
        </div>
      </div>

      <div id="confirmArea" class="confirm-area hidden">
        <div class="confirm-target" id="confirmTarget"></div>
        <div class="confirm-actions">
          <button id="confirmBtn" class="confirm-btn">
            <span class="btn-text" data-i18n="confirmCleanupBtn">Confirm Cleanup</span>
          </button>
          <button id="cancelBtn" class="cancel-btn" data-i18n="cancelBtn">Cancel</button>
        </div>
      </div>

      <div class="action-area">
        <button id="clearBtn" class="primary-btn">
          <span class="btn-text" data-i18n="clearSiteDataBtn">Clear Site Data</span>
          <span class="btn-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <polyline points="3 6 5 6 21 6"></polyline>
              <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
            </svg>
          </span>
        </button>
      </div>

      <div id="statusMessage" class="status-message hidden" role="status" aria-live="polite"></div>
    </main>

    <footer>
      <small>Powered by AhliWeb.com</small>
    </footer>
  </div>
  <script src="origin-utils.js"></script>
  <script src="popup.js"></script>
</body>

</html>
