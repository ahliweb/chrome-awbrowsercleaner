name: Release

on:
  push:
    tags:
      - 'v*'

# Deny everything by default; each job grants only what it needs.
permissions: {}

jobs:
  build:
    name: Build, Lint, Test & Package
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
          # Release builds never restore a cache another workflow could have written.
          no-cache: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify tag matches version sources
        env:
          TAG: ${{ github.ref_name }}
        run: bun scripts/check-version.js "$TAG"

      - name: Run ESLint
        run: bun run lint

      - name: Run unit tests
        run: bun run test:unit

      - name: Build extension package
        run: bun run build:package

      - name: Validate extension package
        run: bun run validate:package

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          format: cyclonedx-json
          output-file: dist/sbom.cdx.json
          upload-artifact: false

      - name: Upload build outputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-artifacts
          path: |
            dist/*.zip
            dist/*.sha256
            dist/sbom.cdx.json
          if-no-files-found: error

  attest:
    name: Attest Build Provenance
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
      contents: read

    steps:
      - name: Download build outputs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-artifacts
          path: dist

      - name: Generate build provenance attestation
        id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'dist/*.zip'

      # The attestation also lives in the GitHub attestation store; attaching it to the
      # release lets offline verifiers (and OpenSSF Scorecard Signed-Releases) find it.
      # One statement covers every zip (Chrome and Edge), so the assets are named per release.
      - name: Export provenance as release assets
        env:
          BUNDLE_PATH: ${{ steps.provenance.outputs.bundle-path }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          base="provenance/aw-browser-cleaner-${TAG}"
          mkdir -p provenance
          cp "${BUNDLE_PATH}" "${base}.sigstore.json"
          jq -e -c '.dsseEnvelope // error("bundle has no dsseEnvelope")' "${BUNDLE_PATH}" \
            > "${base}.intoto.jsonl"
          for zip in dist/*.zip; do
            jq -e --arg name "$(basename "${zip}")" \
              '.dsseEnvelope.payload | @base64d | fromjson | any(.subject[]; .name == $name)' \
              "${BUNDLE_PATH}" > /dev/null || { echo "::error::${zip} is not a provenance subject"; exit 1; }
          done

      - name: Upload provenance assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: provenance
          path: provenance/
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: [build, attest]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download build outputs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-artifacts
          path: dist

      - name: Download provenance assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: provenance
          path: dist

      - name: Extract release notes from CHANGELOG
        env:
          TAG: ${{ github.ref_name }}
        run: |
          NOTES="$RUNNER_TEMP/RELEASE_NOTES.md"
          # Extract changelog section between this tag and next tag heading
          awk -v tag="$TAG" '
            $0 ~ "^## \\[" tag "\\]" { found=1; next }
            found && /^## \[/ { found=0 }
            found { print }
          ' CHANGELOG.md > "$NOTES"
          if [ ! -s "$NOTES" ]; then
            echo "Release for $TAG" > "$NOTES"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body_path: ${{ runner.temp }}/RELEASE_NOTES.md
          files: |
            dist/*.zip
            dist/*.sha256
            dist/sbom.cdx.json
            dist/*.sigstore.json
            dist/*.intoto.jsonl
          draft: false
          prerelease: false

  publish-cws:
    name: Upload to Chrome Web Store
    needs: release
    runs-on: ubuntu-latest
    # Required reviewers on this environment gate the store upload.
    # The environment must be created in Settings -> Environments by a maintainer.
    environment: chrome-web-store
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
          # Release builds never restore a cache another workflow could have written.
          no-cache: true

      - name: Download build outputs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-artifacts
          path: dist

      - name: Upload to Chrome Web Store
        run: bun run upload:cws
        env:
          CWS_EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          CWS_AUTO_PUBLISH: ${{ vars.CWS_AUTO_PUBLISH }}
