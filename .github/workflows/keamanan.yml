# Security leg: secrets (gitleaks) + dependencies (bun audit) + SAST (OpenGrep).
# Internal cross-portfolio standard (DL-098). Replaces CodeQL.
#
# Required check name: "keamanan / sast-rahasia-dependensi" (the job `name:` below).
# No `paths` filter on purpose: a required check that is never reported blocks merging forever.
# No SARIF upload to code scanning on purpose; results are in the job log.
name: ci-keamanan

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: every job opts in to exactly what it needs.
permissions: {}

concurrency:
  group: ci-keamanan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Must match OPENGREP_VERSION and the sha256 in tools/ci/sast/opengrep-scan.ts
  # (cache key only; the script verifies the sha256 itself).
  OPENGREP_VERSION: v2.1.0
  OPENGREP_SHA256_X86: d6a68a84c01a3d8ee933f60847decf1b4d0fd7791a26833b32b95922baf28974
  GITLEAKS_VERSION: 8.30.1
  # sha256 of gitleaks_8.30.1_linux_x64.tar.gz (GitHub release asset digest).
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  keamanan:
    name: keamanan / sast-rahasia-dependensi
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the commit range below needs the base commit
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Gitleaks (pinned version, checksum verified, commit range only)
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL --retry 3 -o "$tmp/gitleaks.tgz" "$url"
          echo "${GITLEAKS_SHA256}  $tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$tmp/gitleaks.tgz" -C "$tmp" gitleaks
          # Scan only the commits introduced by this event, never the whole history.
          if [ "$EVENT_NAME" = "pull_request" ]; then
            range="${PR_BASE_SHA}..${PR_HEAD_SHA}"
          elif [ "$EVENT_NAME" = "push" ] && [ "${PUSH_BEFORE_SHA}" != "0000000000000000000000000000000000000000" ]; then
            range="${PUSH_BEFORE_SHA}..${PUSH_AFTER_SHA}"
          else
            range="-1 ${PUSH_AFTER_SHA}" # manual run or new branch: newest commit only
          fi
          # --redact: secret values never reach the log. The repo has no gitleaks config of its own.
          "$tmp/gitleaks" git --no-banner --redact --verbose --log-opts="$range" .

      - name: bun audit
        run: bun audit --audit-level=high

      # actions/cache v6.1.0. Cache only speeds things up; the script re-verifies the sha256.
      - name: Cache OpenGrep binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/opengrep/${{ env.OPENGREP_VERSION }}
          key: opengrep-${{ env.OPENGREP_VERSION }}-${{ env.OPENGREP_SHA256_X86 }}

      - name: SAST OpenGrep (gate on new ERROR findings outside the baseline)
        run: bun tools/ci/sast/opengrep-scan.ts --keluaran "$RUNNER_TEMP/sast"
